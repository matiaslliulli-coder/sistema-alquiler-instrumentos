spring.application.name=sistema-alquiler-instrumentos
server.port=8080

# ---------- PostgreSQL ----------
# Crea (una sola vez) la base vacia "instrumentos_db" en pgAdmin.
# Si tu usuario/clave son otros, cambialos aqui o define las variables de entorno DB_USER / DB_PASSWORD.
spring.datasource.url=jdbc:postgresql://localhost:5432/${DB_NAME:instrumentos_db}
spring.datasource.username=${DB_USER:postgres}
spring.datasource.password=mll12959961

# ---------- JPA ----------
# Las tablas las crea schema.sql y los datos de prueba data.sql (ambos en src/main/resources).
spring.jpa.hibernate.ddl-auto=none
spring.jpa.open-in-view=false
spring.jpa.show-sql=false

# ---------- Scripts SQL (se ejecutan al iniciar; son idempotentes) ----------
spring.sql.init.mode=always
spring.sql.init.encoding=UTF-8

# ---------- JWT ----------
# En produccion define la variable de entorno JWT_SECRETO (minimo 32 caracteres).
app.jwt.secreto=${JWT_SECRETO:cambia-esta-clave-secreta-de-desarrollo-minimo-32-caracteres}
app.jwt.expiracion-minutos=60

# ---------- Cifrado en reposo (AES-256-GCM) ----------
# Clave de 32 bytes en Base64. En produccion define la variable de entorno CIFRADO_CLAVE.
app.cifrado.clave=${CIFRADO_CLAVE:MDEyMzQ1Njc4OWFiY2RlZjAxMjM0NTY3ODlhYmNkZWY=}
