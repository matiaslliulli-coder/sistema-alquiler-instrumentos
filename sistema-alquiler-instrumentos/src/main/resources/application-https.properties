# Perfil "https": activa TLS en el puerto 8443 y redirige el puerto 8080 (HTTP) a HTTPS.
# Ejecutar con:  --spring.profiles.active=https   (o la variable de IntelliJ: Active profiles = https)
server.port=8443
server.ssl.enabled=true
server.ssl.key-store=classpath:keystore/sistema-instrumentos.p12
server.ssl.key-store-type=PKCS12
server.ssl.key-store-password=${KEYSTORE_PASSWORD:changeit}
server.ssl.key-alias=sistema-instrumentos
app.https.puerto-http=8080
